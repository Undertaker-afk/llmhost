[workspace]
resolver = "2"
members = [
    "crates/llm-core",
    "crates/llm-cpu",
    "crates/llm-quant",
    "crates/llm-engine",
    "crates/llm-capi",
    "crates/llm-server",
    "crates/llm-gpu-wgpu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
half = "2"
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
llm-core = { path = "crates/llm-core" }
llm-quant = { path = "crates/llm-quant" }
llm-cpu = { path = "crates/llm-cpu" }
safetensors = "0.6"
memmap2 = "0.9"
rayon = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }

# fp32 GEMM is unusable at the default opt-level 0. Keep debuginfo.
[profile.dev]
opt-level = 3
